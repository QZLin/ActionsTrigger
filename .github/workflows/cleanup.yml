name: Cleanup Historical Duplicate Runs

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Actually delete the duplicate runs (otherwise report only)
        required: true
        default: false
        type: boolean
      before:
        description: Optional ISO-8601 cutoff; only older runs are inspected
        required: false
        default: ''
        type: string
      workflow:
        description: Workflow file or id to inspect
        required: true
        default: main.yml
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PERSONALTOKEN }}
      ACTIONS_TRIGGER_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install project
        run: uv sync
      - name: Scan historical duplicate runs
        env:
          DELETE_RUNS: ${{ inputs.delete }}
          CUTOFF: ${{ inputs.before }}
          TARGET_WORKFLOW: ${{ inputs.workflow }}
        shell: pwsh
        run: |
          $args = @('--workflow', $env:TARGET_WORKFLOW)
          if ($env:CUTOFF) { $args += @('--before', $env:CUTOFF) }
          if ($env:DELETE_RUNS -eq 'true') { $args += '--delete' }
          uv run actions_trigger-cleanup @args
