name: CI
permissions: write-all

on:
  schedule:
    - cron: 0,30 * * * *

  push:
    branches: [ "main" ]
  #  pull_request:
  #    branches: [ "main" ]

  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Read by actionstrigger.settings; GITHUB_REPOSITORY is provided by Actions.
      GITHUB_TOKEN: ${{ secrets.PERSONALTOKEN }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Init Python Env
        run: |
          #!/usr/bin/pwsh
          uv sync
      - name: Check Env
        run: |
          #!/usr/bin/pwsh
          pwsh --version
          which uv
          uv self version
          uv run python --version
          uv tree
      - name: Execute Script
        run: |
          #!/usr/bin/pwsh
          uv run actionstrigger-ext-config "${{ github.repository }}" --source branch
          uv run actionstrigger-ext-config "${{ github.repository }}" --source release
          uv run actionstrigger
