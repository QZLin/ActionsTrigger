[project]
name = "actions_trigger"
version = "0.3.1"
description = "Github Actions Trigger"
readme = "README.md"
authors = [{ name = "QZLin", email = "qzlin01@163.com" }]
requires-python = ">=3.14"
dependencies = ["requests", "pyyaml", "python-dotenv"]

[project.scripts]
actions_trigger = "actions_trigger.main:main"
actions_trigger-ext-config = "actions_trigger.external_config:main"
actions_trigger-prune = "actions_trigger.duplicate_runs:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
